services:
  web:
    build: ./app
    container_name: mini-api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=platform_db
      - DB_USER=admin
      - DB_PASS=secret123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: mini-db
    environment:
      - POSTGRES_DB=platform_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
